spring:
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: pokemon-wiki
        instructions: "只读查询 pokemon_wiki.db。先调用 list_schema，再调用 query，只接受一条 SELECT 或 WITH。"
        capabilities:
          resource: false
          prompt: false
          completion: false

server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8
    max-connections: 2048
    threads:
      min-spare: 5
      max: 100
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5,0.95
        spring.data.repository.invocations: 0.5,0.95
